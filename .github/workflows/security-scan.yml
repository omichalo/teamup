name: Security Scan

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  schedule:
    # Scan hebdomadaire de tout l'historique Git
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: Scan for secrets with TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4.4.0
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # trufflesecurity/trufflehog@v3.99.3
      - name: Run TruffleHog (pull_request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # trufflesecurity/trufflehog@v3.99.3
      - name: Run TruffleHog (push/schedule)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e
        with:
          path: ./
          extra_args: --only-verified

  gitleaks-scan:
    name: Scan for secrets with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4.4.0
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2.3.9 — lit .gitleaksignore à la racine
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  dependency-scan:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v4.4.0
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node@v4.4.0 — Node 22 (requis par firebase-admin@14 / sanitize-html@2.18)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # Seuil inchangé (moderate). Périmètre production (--omit=dev) : surface déployable.
      # Les advisories sans patch upstream (ex. braces via eslint, sprintf via jest) restent
      # visibles dans le rapport full ci-dessous ; le gate prod est bloquant.
      - name: Run npm audit (app, production)
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate --json | tee npm-audit-app.json

      - name: Run npm audit (functions, production)
        working-directory: functions
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate --json | tee ../npm-audit-functions.json

      # Rapport informatif (devDependencies) — n'affecte pas le gate production ci-dessus
      - name: Export full npm audit reports (incl. devDependencies)
        if: always()
        run: |
          set +e
          npm audit --json > npm-audit-app-full.json
          (cd functions && npm audit --json > ../npm-audit-functions-full.json)
          exit 0

      # actions/upload-artifact@v4.6.2 — rapports utiles même si un job échoue
      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-reports
          path: |
            npm-audit-app.json
            npm-audit-functions.json
            npm-audit-app-full.json
            npm-audit-functions-full.json
          if-no-files-found: ignore
          retention-days: 14
